[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ehds-dataholder-mcp"
version = "0.1.0"
description = "MCP server for EHDS data holders to publish HealthDCAT-AP metadata to the central EHDS catalog"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ehds", "healthdcat-ap", "dcat", "rdf", "mcp", "metadata", "health-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "rdflib>=7.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
ehds-dataholder-mcp = "ehds_dataholder_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ehds_dataholder_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
